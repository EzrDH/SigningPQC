spring.application.name=signingpqc
# Backend hanya untuk pemakaian lokal (KNF-14).
server.address=127.0.0.1
server.port=8085
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PKI uji (hanya lingkungan uji). Kunci disimpan sebagai PKCS#12 berpassword di folder data.
signingpqc.data-dir=${user.home}/SigningPQC-uji
signingpqc.keystore-password=uji-signingpqc
# Alamat CRL yang ditulis ke sertifikat (CRL Distribution Points), dilayani oleh backend ini.
signingpqc.crl-base-url=http://127.0.0.1:${server.port}/api/pki/crl/
# Kosong: TSA lokal dipanggil di dalam proses. Isi dengan URL untuk memakai TSA RFC 3161 lain.
signingpqc.tsa.rsa-url=
signingpqc.tsa.mldsa-url=
